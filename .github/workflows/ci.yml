name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Логикийн тест (DB шаардахгүй)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Хамаарал суулгах
        run: |
          python -m pip install -q --upgrade pip
          pip install -q -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: pytest (tests/unit — тарифын тооцоолол)
        working-directory: backend
        run: python -m pytest -q

      # Амьд Postgres шаардахгүй хуучин скрипт тестүүд. Эдгээр нь mock горимд
      # ажилладаг тул CI-д шууд орно. DB шаарддаг нь (test_qr_debt, test_integration_api,
      # test_registered_live, test_public_site_lookup, test_smoke_endpoints, ...)
      # энд ОРООГҮЙ — сервер дээр гараар ажиллуулна.
      - name: Хуучин скрипт тестүүд (mock)
        working-directory: backend
        env:
          PARKING_DEBUG: "true"
          PARKING_QPAY_MOCK: "true"
          PARKING_EBARIMT_MOCK: "true"
          PARKING_BARRIER_MOCK: "true"
        run: |
          set -e
          for t in test_site_qpay_account test_qpay_ebarimt test_driver_import \
                   test_screen_deeplink test_permissions; do
            echo "── $t ──"
            python "tests/$t.py"
          done

  postgres-settings:
    name: PostgreSQL ${{ matrix.postgres }} settings, payments and migrations
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '18.6']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: parking_test
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: parking_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q -r backend/requirements.txt -r backend/requirements-dev.txt
      - working-directory: backend
        env:
          PARKING_TEST_DATABASE_URL: postgresql+psycopg2://parking_test:ci-disposable-only@localhost:5432/parking_test
        run: python -m pytest -q tests/postgres

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci --no-audit --no-fund
      - working-directory: frontend
        run: npm run build

  security:
    name: Аюулгүй байдлын шалгалт
    runs-on: ubuntu-latest
    # Security failures fail CI. Production promotion also requires staging
    # acceptance and an explicitly approved commit (see deploy/approved-release.sh).
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Python хамаарлын мэдэгдэж буй CVE (2026-08-20-нд: 0)
      - name: pip-audit
        run: |
          python -m pip install -q pip-audit
          pip-audit -r backend/requirements.txt -r backend/requirements-optional.txt

      # Кодын статик шинжилгээ. -ll = зөвхөн MEDIUM+ хүндрэлтэй.
      - name: bandit
        run: |
          python -m pip install -q bandit
          bandit -r backend/app -ll

      # Нээлттэй repo тул нууц задрахаас сэргийлнэ. seed.py-ийн нууц үг
      # 2026-07-28-нд ийм байдлаар задарсан түүхтэй.
      - name: gitleaks (нууц задралын хайлт)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm audit нь build job-д --no-audit-аар зориудаар унтраасан тул энд
      # тусад нь ажиллуулна. --audit-level=high: одоо байгаа 2 moderate
      # (react-router open-redirect) нь энэ кодод АШИГЛАГДАХГҮЙ болохыг
      # шалгасан — засвар нь router v7 руу шилжих эвдэрсэн өөрчлөлт шаардана.
      - name: npm audit
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
