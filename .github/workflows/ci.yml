name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Логикийн тест (DB шаардахгүй)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Хамаарал суулгах
        run: |
          python -m pip install -q --upgrade pip
          pip install -q -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: pytest (tests/unit — тарифын тооцоолол)
        working-directory: backend
        run: python -m pytest -q

      # Амьд Postgres шаардахгүй хуучин скрипт тестүүд. Эдгээр нь mock горимд
      # ажилладаг тул CI-д шууд орно. DB шаарддаг нь (test_qr_debt, test_integration_api,
      # test_registered_live, test_public_site_lookup, test_smoke_endpoints, ...)
      # энд ОРООГҮЙ — сервер дээр гараар ажиллуулна.
      - name: Хуучин скрипт тестүүд (mock)
        working-directory: backend
        env:
          PARKING_DEBUG: "true"
          PARKING_QPAY_MOCK: "true"
          PARKING_EBARIMT_MOCK: "true"
          PARKING_BARRIER_MOCK: "true"
        run: |
          set -e
          for t in test_site_qpay_account test_qpay_ebarimt test_driver_import \
                   test_screen_deeplink test_permissions; do
            echo "── $t ──"
            python "tests/$t.py"
          done

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci --no-audit --no-fund
      - working-directory: frontend
        run: npm run build
