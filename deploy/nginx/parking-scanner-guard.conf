# Сканнерын шуугианг таслах (үе шат 2). server { } контекстэд include хийнэ.
#
# SPA-гийн try_files улмаас /xxx.php → index.html болж 200 буцдаг тул ботуудад
# «амьд» мэт харагдаж, өдөрт хэдэн зуун хүсэлт татдаг. Бодит хэрэглэгч эдгээр
# замаар хэзээ ч ханддаггүй тул холбоог чимээгүй тасална (444).
location ~* \.(php|asp|aspx|jsp|cgi)$ { access_log off; return 444; }
location ~  /\.(env|git|svn|aws)      { access_log off; return 444; }
