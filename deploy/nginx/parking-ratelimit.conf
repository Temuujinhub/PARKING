# Rate limit-ийн бүсүүд. Хязгаарууд нь ТААМАГ БИШ — 2026-08-20-нд
# test.easy-parking.mn-ийн access.log-оос хэмжсэн бодит ачаалалд суурилсан:
#
#   • Бодит оператор (202.37.235.4)  : дээд тал нь  38 хүсэлт/мин
#   • Сканнер бот ×2                 :          210-217 хүсэлт/мин
#                                      (/xxx.php, /wp-includes/... web-shell хайлт)
#   • /api/auth/login                : 24 цагт ердөө 2 хүсэлт
#
# ⚠ ГОЛ ЭРСДЭЛ: Monnis (PROD) дээр олон оператор НЭГ NAT гарцаар гардаг бол
#   бүх хүсэлт нэг IP-гээр тоологдоно. Тиймээс ерөнхий /api/ хязгаарыг
#   САНААТАЙГААР өгөөмөр (600/мин) тавьсан. Хатуу хязгаарыг зөвхөн login дээр —
#   тэнд бодит урсгал 2 хүсэлт/ХОНОГ тул 10/мин нь маш өгөөмөр хэвээр.

limit_req_zone  $binary_remote_addr  zone=parking_login:10m  rate=10r/m;
limit_req_zone  $binary_remote_addr  zone=parking_api:10m    rate=600r/m;
limit_conn_zone $binary_remote_addr  zone=parking_conn:10m;

# 429 буцаана (nginx-ийн default 503 нь "сервер унасан" мэт харагдаж
# мониторингийг андуурдаг).
limit_req_status  429;
limit_conn_status 429;
