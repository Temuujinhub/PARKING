# Хамгаалалтын header-үүдийн НЭГДСЭН эх сурвалж.
#
# ЯАГААД SNIPPET ВЭ: nginx-д `add_header` УДАМШДАГГҮЙ — дотоод location блокт
# өөрийн add_header байвал эцгийн БҮХ header алга болдог. Үүний улмаас
# /assets/ зам нь HSTS, X-Frame-Options, nosniff-ээ бүгдийг алддаг байсныг
# 2026-08-20-нд хэмжиж баталсан. Иймд add_header агуулсан location БҮРД
# энэ файлыг `include` хийнэ.

add_header X-Frame-Options            "SAMEORIGIN"                          always;
add_header X-Content-Type-Options     "nosniff"                             always;
add_header Referrer-Policy            "strict-origin-when-cross-origin"     always;
add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;
add_header Permissions-Policy         "geolocation=(), microphone=(), camera=(), payment=()" always;

# CSP — ОДООГООР ЗӨВХӨН REPORT-ONLY (юуг ч блоклохгүй, зөвхөн мэдээлнэ).
# Орцууд нь бодит build-аас шалгагдсан:
#   • index.html-д inline <script> бий (theme flash)  → 'unsafe-inline'
#   • Tailwind/React inline style                      → style-src 'unsafe-inline'
#   • fonts.googleapis.com (css) + fonts.gstatic.com (шрифт)
#   • favicon = data: URI, камерын зураг = data:/blob:
#   • WebSocket /ws/                                   → connect-src wss:
#
# 2-3 хоног ажиглаад зөрчил гарахгүй бол `-Report-Only` дагаварыг хасна.
# Тогтвортой шийдэл: index.html-ийн inline theme script-ийг bundle руу зөөж,
# 'unsafe-inline'-гүй цэвэр `script-src 'self'` болгох.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' wss: ws:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
