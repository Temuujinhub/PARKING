# LPR callback-ийн хамгаалалт (үе шат 4). server { } контекстэд include хийнэ.
#
# 2026-08-20: X-Forwarded-For хуурч камер болж дүр эсгэн, НЭВТРЭЛТГҮЙГЭЭР хаалт
# нээх боломжтой байсныг туршилтаар баталсан. Хоёр давхар хамгаалалт:
#   1) X-Forwarded-For $remote_addr — халдагчийн XFF гинжийг таслана
#   2) allow/deny — гаднаас огт хүрэхгүй болгоно
#
# ⚠ КАМЕР HTTP PUSH ХИЙДЭГ БОЛ энэ файлд түүний дэд сүлжээг нэмнэ. Хэмжих:
#     journalctl -u parking-backend --since '-7 days' \
#       | grep -oE 'lpr_push: ip=[0-9.]+' | sort | uniq -c | sort -rn
# Хоосон гарвал (event нь comet сувгаар ирдэг) доорх хэвээр аюулгүй.
location /api/lpr/ {
    include snippets/parking-security.conf;
    allow 127.0.0.1;
    # allow 192.168.6.0/24;    # ← камерын дэд сүлжээ (ХЭМЖИЛТЭЭР баталсны дараа)
    deny all;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 60s;
}
